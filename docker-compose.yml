name: cubic

services:
  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cubic}
      POSTGRES_USER: ${POSTGRES_USER:-cubic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubic-dev-password}
    volumes:
      - cubic_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubic} -d ${POSTGRES_DB:-cubic}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cubic

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cubic}:${POSTGRES_PASSWORD:-cubic-dev-password}@db:5432/${POSTGRES_DB:-cubic}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cubic

  livekit:
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
          advertise_internal_ip: ${LIVEKIT_ADVERTISE_INTERNAL_IP:-true}
          allow_tcp_fallback: true
          node_ip: ${LIVEKIT_NODE_IP:-192.168.15.172}
        keys:
          ${LIVEKIT_API_KEY:-CUBICDEVKEY}: ${LIVEKIT_API_SECRET:-cubic-development-secret-change-me-0123456789}
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          udp_port: 3478
    ports:
      - "${LIVEKIT_SIGNAL_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:3478/udp"
    networks:
      - cubic

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cubic}:${POSTGRES_PASSWORD:-cubic-dev-password}@db:5432/${POSTGRES_DB:-cubic}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cubic_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
      GROUP_AVATAR_MAX_BYTES: ${GROUP_AVATAR_MAX_BYTES:-2097152}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-CUBICDEVKEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-cubic-development-secret-change-me-0123456789}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - cubic_media:/data/media
    networks:
      - cubic

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
      BODY_SIZE_LIMIT: 4M
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3010}:3000"
    networks:
      - cubic

volumes:
  cubic_postgres:
  cubic_media:

networks:
  cubic:
    driver: bridge
